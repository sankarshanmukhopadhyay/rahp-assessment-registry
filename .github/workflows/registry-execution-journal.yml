name: Registry canonical execution journal (controlled)
on:
  pull_request:
    paths:
      - '.github/workflows/registry-execution-journal.yml'
      - 'scripts/registry_execution_journal.py'
      - 'tests/test_registry_execution_journal.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-execution-journal.yml'
      - 'scripts/registry_execution_journal.py'
      - 'tests/test_registry_execution_journal.py'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Explicitly publish the exact canonical result as a comment on existing Registry case #4'
        type: boolean
        default: false
        required: true
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout canonical Toolkit at immutable contract revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical controller runtime
        run: python3 -m pip install -r toolkit/requirements.txt
      - name: Fail-closed publication and identity tests
        run: |
          python3 -m unittest discover -s tests -p 'test_registry_execution_journal.py' -v
          python3 -m unittest discover -s tests -p 'test_registry_execution_binding.py' -v
      - name: Execute and qualify source-pinned controller outcome
        env:
          REGISTRY_EXECUTION_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=70298566dc897669e22bf37759843d6b7c0597d2
          [[ "$(git -C toolkit rev-parse HEAD)" = "$expected" ]]
          mkdir -p build/registry-assessment
          python3 toolkit/tools/autonomous_assurance_controller.py \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --machine-output build/registry-assessment/result.json \
            --human-output build/registry-assessment/result.md
          python3 scripts/verify_registry_assessment_run.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --out build/registry-assessment/qualification.json
          python3 scripts/bind_registry_execution.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/execution-binding.json
          python3 scripts/registry_execution_journal.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --binding build/registry-assessment/execution-binding.json \
            --toolkit-revision "$expected" \
            --receipt build/registry-assessment/journal-receipt.json
      - name: Retain exact canonical result and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-registry-controller-journal
          path: build/registry-assessment/
          if-no-files-found: warn
  publish:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-registry-controller-journal
          path: build/registry-assessment
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Explicitly publish exactly one verified Registry execution event
        env:
          REGISTRY_EXECUTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/registry_execution_journal.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --binding build/registry-assessment/execution-binding.json \
            --toolkit-revision 70298566dc897669e22bf37759843d6b7c0597d2 \
            --receipt build/registry-assessment/published-receipt.json \
            --apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/registry-assessment/published-receipt.json').read_text())
          assert result['state'] == 'acknowledged', "no authoritative comment acknowledgement"
          assert result['assurance_determination_imported'] is False
          assert result['controller_cutover_qualified'] is False
          print('Registry #4 has a source-pinned execution event; not a specialist PASS')
          PY
      - name: Preserve publication acknowledgment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-controller-journal-acknowledgment
          path: build/registry-assessment/published-receipt.json
          if-no-files-found: warn
