name: Registry grouped canonical reviewer packet (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/registry-group-canonical-reviewer.yml'
      - 'scripts/registry_group_review_packet.py'
      - 'tests/test_registry_group_review_packet.py'
      - 'outbox/pending/spec-dependency-2026-11-16.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-group-canonical-reviewer.yml'
      - 'scripts/registry_group_review_packet.py'
      - 'tests/test_registry_group_review_packet.py'
      - 'outbox/pending/spec-dependency-2026-11-16.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 9e167fa7719802e741eed1ca60ea0b6c2968ff07
          path: toolkit-worker
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Test source identities and adversarial packet construction
        run: python3 -m unittest discover -s tests -p 'test_registry_group_review_packet.py' -v
      - name: Reproduce original pinned combined group using canonical Toolkit router
        run: |
          set -euo pipefail
          [[ "$(git -C toolkit-source rev-parse HEAD)" = 7925a7edf87a74f222f163f879f73a7f38de4686 ]]
          [[ "$(git -C monitor rev-parse HEAD)" = 7e2813c8daf867a21e4064513cc83612726aeb44 ]]
          python3 toolkit-source/tools/dtg_portfolio_routing.py \
            --findings monitor/data/findings/2026/11/16.json \
            --policy toolkit-source/instances/dtg/assurance-routing.yaml \
            --normalization-policy toolkit-source/instances/dtg/finding-normalization.yaml \
            --snapshot-date 2026-11-16 --out-dir build/group
      - name: Render and verify actual Toolkit reviewer on source-qualified group
        run: |
          set -euo pipefail
          expected=9e167fa7719802e741eed1ca60ea0b6c2968ff07
          [[ "$(git -C toolkit-worker rev-parse HEAD)" = "$expected" ]]
          python3 scripts/registry_group_review_packet.py \
            --manifest outbox/pending/spec-dependency-2026-11-16.json \
            --combined build/group/combined-events.json \
            --findings monitor/data/findings/2026/11/16.json \
            --toolkit toolkit-worker --toolkit-revision "$expected" \
            --packet build/group/reviewer-packet.md \
            --receipt build/group/reviewer-compatibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/group/reviewer-compatibility.json').read_text())
          assert r['finding_count'] == 4
          assert r['toolkit_issue_number_substituted'] is False
          assert r['toolkit_effectful_consumer_dispatched'] is False
          assert r['assurance_determination'] is None
          assert r['cutover_authorized'] is False
          packet = Path('build/group/reviewer-packet.md').read_text()
          assert 'Do any of the 4 changes jointly' in packet
          print('PASS canonical grouped reviewer packet: original source + pinned worker, no issue mutation')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-group-reviewer-compatibility
          path: build/group/
          if-no-files-found: warn
