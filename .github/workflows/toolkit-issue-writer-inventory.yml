name: Inventory Toolkit issue-writing authority (read-only)
on:
  pull_request:
    paths:
      - 'scripts/audit_toolkit_issue_writers.py'
      - 'scripts/verify_toolkit_legacy_registration_states.py'
      - 'tests/test_toolkit_legacy_registration_states.py'
      - 'tests/test_toolkit_issue_writers.py'
      - 'tests/test_toolkit_historical_refs.py'
      - 'scripts/audit_toolkit_historical_refs.py'
      - '.github/workflows/toolkit-issue-writer-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_toolkit_issue_writers.py'
      - 'scripts/verify_toolkit_legacy_registration_states.py'
      - 'tests/test_toolkit_legacy_registration_states.py'
      - 'tests/test_toolkit_issue_writers.py'
      - 'scripts/audit_toolkit_historical_refs.py'
      - 'tests/test_toolkit_historical_refs.py'
      - '.github/workflows/toolkit-issue-writer-inventory.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
      - name: Checkout live Toolkit authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: main
          fetch-depth: 0 # all remote branches and tags must be locally resolvable
          path: toolkit
          persist-credentials: false
      - name: Test inventory false-success and drift boundaries
        run: python3 -m unittest discover -s registry/tests -p 'test_toolkit_issue_writers.py' -v
      - name: Qualify live Toolkit publication and issue-number consumers
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git -C toolkit rev-parse HEAD)"
          python3 registry/scripts/audit_toolkit_issue_writers.py \
            --toolkit-workflows toolkit/.github/workflows \
            --toolkit-revision "$revision" \
            --out build/toolkit-issue-writer-inventory.json
      - name: Test old-ref source audit and false-success boundaries
        run: python3 -m unittest discover -s registry/tests -p 'test_toolkit_historical_refs.py' -v
      - name: Validate live old-workflow registration failure modes
        run: python3 -m unittest discover -s registry/tests -p 'test_toolkit_legacy_registration_states.py' -v
      - name: Independently verify exact Toolkit workflow retirement state
        run: >-
          python3 registry/scripts/verify_toolkit_legacy_registration_states.py
          --out build/toolkit-legacy-registration-state.json
      - name: Audit all historical writer paths across branch and tag refs
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        # Exposed historical writers are expected discovery evidence in a PR;
        # only an explicit operator dispatch treats exposure as a blocking gate.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 registry/scripts/audit_toolkit_historical_refs.py \
            --toolkit toolkit \
            --out build/toolkit-historical-ref-audit.json
      - name: Retain verified inventory with source revision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolkit-issue-writer-inventory
          path: |
            build/toolkit-issue-writer-inventory.json
            build/toolkit-historical-ref-audit.json
            build/toolkit-legacy-registration-state.json
          if-no-files-found: warn
