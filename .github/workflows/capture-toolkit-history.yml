name: Capture historical Toolkit issue content (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-toolkit-history.yml'
      - 'scripts/capture_toolkit_history.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test source archive boundaries
        run: python3 -m unittest discover -s tests -p 'test_capture_toolkit_history.py' -v
      - name: Capture source issue, comment and event collections
        env:
          SOURCE_ARCHIVE_TOKEN: ${{ github.token }}
        run: python3 scripts/capture_toolkit_history.py --output build/toolkit-history-export
      - name: Retain provisional archive export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolkit-history-export
          path: build/toolkit-history-export/
          retention-days: 30
          if-no-files-found: warn
