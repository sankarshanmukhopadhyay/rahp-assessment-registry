name: DTG #88 pinned Trust Tasks runtime replay
on:
  pull_request:
    paths:
      - '.github/workflows/dtg-88-source-consumer-replay.yml'
      - 'ops/assessments/dtg-spec-dependency-source-materiality-2026-11.json'
      - 'cases/dtg/spec-dependency-2026-11.json'
      - 'scripts/verify_vti_041_replay.py'
      - 'tests/test_vti_041_replay.py'
      - 'ops/assessments/vti-041-critical-extension-probe.rs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dtg-88-pinned-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  upstream-runtime-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout exact upstream 0.40.0 release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: trustoverip/dtgwg-trust-tasks-tf
          ref: 69814c5ef60b5fa2d75fe2687efad1d12d34283f
          path: trust-tasks
          persist-credentials: false
      - name: Checkout historical pinned VTI consumer dependency evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: 66a7c2aa362e82cdbbb3b384850d73fa64d97848
          path: vti-source
          persist-credentials: false
      - name: Qualify observed VTI dependency mismatch against immutable target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C vti-source rev-parse HEAD)" = 66a7c2aa362e82cdbbb3b384850d73fa64d97848 ]]
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path
          source = Path('vti-source')
          case = json.loads(Path('ops/assessments/dtg-spec-dependency-source-materiality-2026-11.json').read_text())
          observed = case['downstream_vti_dependency_observation']
          assert observed['revision'] == '66a7c2aa362e82cdbbb3b384850d73fa64d97848'
          manifest = tomllib.loads((source/'Cargo.toml').read_text())
          deps = manifest['workspace']['dependencies']
          assert deps['trust-tasks-rs']['version'] == observed['trust_tasks_rs_declared']
          assert deps['trust-tasks-https']['version'] == observed['trust_tasks_https_declared']
          assert deps['jsonwebtoken']['version'] == '11.1.0'
          assert deps['jsonschema']['version'] == '0.60'
          lock = tomllib.loads((source/'Cargo.lock').read_text())
          for package, expected in observed['lockfile_versions'].items():
              actual = sorted(x['version'] for x in lock['package'] if x['name'] == package)
              assert actual == expected, (package, actual, expected)
          assert not observed['target_native_runtime_reproduced']
          print('PASS exact VTI source pin resolves old Trust Tasks and dual JWT/schema majors; no VTI runtime claim')
          PY
      - name: Confirm immutable source and matching release contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C trust-tasks rev-parse HEAD)" = 69814c5ef60b5fa2d75fe2687efad1d12d34283f ]]
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('ops/assessments/dtg-spec-dependency-source-materiality-2026-11.json').read_text())
          assert record['case_id'] == 'RAHP-AR-DTG-0002'
          assert record['group_assurance_determination'] == 'not_assessed'
          release = next(f for f in record['source_findings'] if f['finding_id'] == 'acc9772126b1a3820240')
          assert release['source_tag_object'] == '0d9d522a6025423ac77836ca6b40ce2893056d66'
          root = Path('trust-tasks')
          https = (root / 'trust-tasks-https/Cargo.toml').read_text()
          rs = (root / 'trust-tasks-rs/Cargo.toml').read_text()
          assert 'version = "0.40.0"' in https
          assert 'version = "0.40.0"' in rs
          assert 'jsonwebtoken = { version = "11"' in https
          assert 'jsonschema = { version = "0.60"' in rs
          examples = json.loads((root / 'fixtures/consume/ext-critical.json').read_text())
          assert any(x.get('expect') == 'unsupportedExtension' for x in examples['cases'])
          assert any(x.get('expect') == 'malformedRequest' for x in examples['cases'])
          print('PASS exact 0.40.0 release source, dependency contracts and adversarial vector coverage')
          PY
      - name: Execute actual Rust consume_inbound extCritical negative cases
        working-directory: trust-tasks
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked -p trust-tasks-rs --test ext_critical -- --nocapture
      - name: Execute actual HTTPS JWT-feature runtime tests
        working-directory: trust-tasks
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked -p trust-tasks-https --features jwt --tests -- --nocapture
  vti-current-consumer-baseline:
    # Cold VTI builds take >10 minutes. Actual source-pinned run #44469222142
    # passed 13 JWT and 16 receiver-spine tests. Re-run deliberately when
    # the pinned consumer revision or assessment question changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout immutable historical VTI source baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: 66a7c2aa362e82cdbbb3b384850d73fa64d97848
          path: vti
          persist-credentials: false
      - name: Establish actual downstream versions before claiming compatibility
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C vti rev-parse HEAD)" = 66a7c2aa362e82cdbbb3b384850d73fa64d97848 ]]
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('vti')
          source = (root / 'Cargo.toml').read_text()
          versions = {}
          for crate in ('trust-tasks-rs', 'trust-tasks-https', 'jsonwebtoken', 'jsonschema'):
              m = re.search(r'^' + re.escape(crate) + r'\s*=\s*\{\s*version\s*=\s*"([^"]+)"',
                            source, re.M)
              assert m, f'missing workspace dependency: {crate}'
              versions[crate] = m.group(1)
          assert versions == {'trust-tasks-rs': '0.39.0',
                              'trust-tasks-https': '0.39',
                              'jsonwebtoken': '11.1.0',
                              'jsonschema': '0.60'}, versions
          print('VTI baseline versions:', versions)
          print('VTI currently pins Trust Tasks 0.39, NOT 0.40; '
                'passing this job cannot establish 0.40 consumer upgrade')
          PY
      - name: Install VTI's declared native build dependencies
        run: bash vti/scripts/install-build-deps.sh
      - name: Provide VTI's declared build-memory headroom
        uses: ./vti/.github/actions/add-swap
      - name: Exercise target-native VTI JWT negative-path tests at current baseline
        working-directory: vti
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked -p vti-common --lib auth::jwt::tests -- --nocapture
      - name: Exercise target-native VTI Trust Task spine tests at current baseline
        working-directory: vti
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked -p vti-trust-task-server --test spine -- --nocapture
  vti-041-consumer-reassessment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout immutable VTI 0.41 consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: 0366ad0b3ce4604d2b4cd634cb93486c12dcff03
          path: vti
          persist-credentials: false
      - name: Install pinned target build dependencies
        run: bash vti/scripts/install-build-deps.sh
      - name: Provide target build-memory headroom
        uses: ./vti/.github/actions/add-swap
      - name: Verify subject and execute nonvacuous native JWT and receiver tests
        env:
          CARGO_TERM_COLOR: never
        run: python3 scripts/verify_vti_041_replay.py vti
  vti-041-critical-extension-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: 0366ad0b3ce4604d2b4cd634cb93486c12dcff03
          path: vti
          persist-credentials: false
      - run: bash vti/scripts/install-build-deps.sh
      - uses: ./vti/.github/actions/add-swap
      - name: Execute signed service probe with isolated test-only overlay
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          target=vti/vtc-service/tests/it/single_admin_mode.rs
          test "$(git -C vti rev-parse HEAD)" = 0366ad0b3ce4604d2b4cd634cb93486c12dcff03
          test -z "$(git -C vti status --porcelain)"
          echo '7c0a1d33d7039f5e93a027495750c4a3b19b9fe785801363da31c04297787b3d  '"$target" | sha256sum -c -
          cat ops/assessments/vti-041-critical-extension-probe.rs >> "$target"
          test "$(git -C vti diff --name-only)" = vtc-service/tests/it/single_admin_mode.rs
          (cd vti && cargo test --locked -p vtc-service --test it registry_88_nested_critical_extensions -- --nocapture) | tee critical-extension-probe.log
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' critical-extension-probe.log
      - name: Retain observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vti-041-critical-extension-probe
          path: critical-extension-probe.log
          if-no-files-found: warn
