name: Registry pending intake live shadow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/outbox-live-shadow.yml'
      - 'scripts/registry_outbox.py'
      - 'scripts/registry_intake.py'
      - 'outbox/pending/**'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify Registry intake tests and negative behavior
        run: |
          python3 scripts/validate_cases.py
          python3 -m unittest discover -s tests -p 'test_registry_outbox.py' -v
          python3 -m unittest discover -s tests -p 'test_registry_intake.py' -v
      - name: Verify approved pending pilot against live Registry issue collection
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/registry_outbox.py \
            --manifest outbox/pending/network-answer-pilot.json \
            --receipt build/outbox-shadow/receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('build/outbox-shadow/receipt.json').read_text())
          assert receipt['mode'] == 'dry_run'
          assert receipt['state'] == 'owner_observed'
          assert receipt['owner_number'] == 4
          assert receipt['assurance_determination'] is None
          print('Verified live Registry #4 owner; no publication or assurance inferred')
          PY
      - name: Retain read-only live receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-pending-intake-live-shadow
          path: build/outbox-shadow/receipt.json
          if-no-files-found: warn
