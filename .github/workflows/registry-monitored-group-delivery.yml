name: Controlled Registry monitored-group successor (manual)
on:
  pull_request:
    paths:
      - '.github/workflows/registry-monitored-group-delivery.yml'
      - 'scripts/registry_monitored_group_delivery.py'
      - 'scripts/run_monitored_group_preflight.sh'
      - 'tests/test_registry_monitored_group_delivery.py'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/recover exact Registry #272 successor only after Toolkit reservation'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Verify admission failures before enabling a write
        run: python3 -m unittest discover -s tests -p 'test_registry_monitored_group_delivery.py' -v
      - name: Requalify pinned source, live owner, maintainer and reservation
        if: github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: bash scripts/run_monitored_group_preflight.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-monitored-group-preflight
          path: build/group/
          if-no-files-found: ignore
  publish:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Requalify all source and authority evidence before issue POST
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: bash scripts/run_monitored_group_preflight.sh --apply
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-monitored-group-publication
          path: build/group/
          if-no-files-found: ignore
