name: Controlled Registry monitored-group successor (manual)
on:
  pull_request:
    paths:
      - '.github/workflows/registry-monitored-group-delivery.yml'
      - 'scripts/registry_monitored_group_delivery.py'
      - 'scripts/run_monitored_group_preflight.sh'
      - 'tests/test_registry_monitored_group_delivery.py'
      - 'scripts/registry_group_observation_ack.py'
      - 'tests/test_registry_group_observation_ack.py'
      - 'scripts/verify_toolkit_writer_quiescence.py'
      - 'tests/test_toolkit_writer_quiescence.py'
      - 'tests/test_coordinated_group_transaction.py'
      - 'scripts/verify_group_reference_continuity.py'
      - 'tests/test_group_reference_continuity.py'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/recover exact Registry #272 successor only after Toolkit reservation'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Verify admission failures before enabling a write
        run: python3 -m unittest discover -s tests -p 'test_registry_monitored_group_delivery.py' -v
      - name: Exercise durable observation acknowledgment and replay
        run: python3 -m unittest discover -s tests -p 'test_registry_group_observation_ack.py' -v
      - name: Rehearse interruption-safe owner and observation recovery
        run: python3 -m unittest discover -s tests -p 'test_coordinated_group_transaction.py' -v
      - name: Reject missing or substituted post-acknowledgment references
        run: python3 -m unittest discover -s tests -p 'test_group_reference_continuity.py' -v
      - name: Requalify pinned source, live owner, maintainer and reservation
        if: github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: bash scripts/run_monitored_group_preflight.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-monitored-group-preflight
          path: build/group/
          if-no-files-found: ignore
  publish:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Reject active inventoried Toolkit writer runs before successor POST
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -p 'test_toolkit_writer_quiescence.py' -v
          python3 scripts/verify_toolkit_writer_quiescence.py \
            --out build/group/toolkit-writer-quiescence.json --require-quiescent
      - name: Requalify all source and authority evidence before issue POST
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: bash scripts/run_monitored_group_preflight.sh --apply
      - name: Requalify created owner and durably acknowledge current source observation
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/registry_group_observation_ack.py
          --manifest outbox/pending/spec-dependency-2026-11-16.json
          --combined build/group/combined-events.json
          --candidate build/group/owner-candidate.json
          --receipt build/group/observation-ack.json
          --apply
      - name: Re-read original Toolkit and protected consumer locators after acknowledgment
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify_group_reference_continuity.py
          --manifest outbox/pending/spec-dependency-2026-11-16.json
          --owner-receipt build/group/owner-delivery.json
          --observation-receipt build/group/observation-ack.json
          --out build/group/reference-continuity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-monitored-group-publication
          path: build/group/
          if-no-files-found: ignore
