name: Pinned DTG routing replay (non-publishing)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinned-dtg-routing-replay.yml'
      - 'scripts/verify_dtg_replay.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout registry verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
      - name: Checkout canonical Toolkit engine and routing policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - name: Checkout observed Monitor snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 1a1982212bce36d79a5fb9dc6d58bec7b7d9e01a
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Toolkit routing dependencies
        run: python3 -m pip install -r toolkit/requirements.txt
      - name: Check verifier's false-success controls
        run: python3 -m unittest discover -s registry/tests -p 'test_verify_dtg_replay.py' -v
      - name: Execute historical replay with the canonical Toolkit routing implementation
        shell: bash
        run: |
          set -euo pipefail
          source=monitor/data/findings/2026/11/13.json
          test -s "$source"
          python3 toolkit/tools/dtg_portfolio_routing.py \
            --findings "$source" \
            --policy toolkit/instances/dtg/assurance-routing.yaml \
            --normalization-policy toolkit/instances/dtg/finding-normalization.yaml \
            --snapshot-date 2026-11-13 \
            --out-dir build/replay
          python3 registry/scripts/verify_dtg_replay.py \
            --findings "$source" \
            --routing build/replay/routing.json \
            --combined build/replay/combined-events.json \
            --dpip build/replay/dpip-events.json \
            --unresolved build/replay/unresolved.json \
            --toolkit-revision 70298566dc897669e22bf37759843d6b7c0597d2 \
            --monitor-revision 1a1982212bce36d79a5fb9dc6d58bec7b7d9e01a \
            --snapshot-date 2026-11-13 \
            --out build/replay/provenance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/replay/provenance.json').read_text())
          print(json.dumps(r['counts'], sort_keys=True))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Historical pinned DTG replay (non-publishing)\n\n')
              out.write('Pinned Toolkit/Monitor revisions and replay results retained as artifact.\n\n')
              out.write('This is not current-monitor coverage, target runtime evidence or assurance PASS.\n')
          PY
      - name: Retain pinned historical replay artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-dtg-replay-2026-11-13
          path: |
            build/replay/
          if-no-files-found: warn
