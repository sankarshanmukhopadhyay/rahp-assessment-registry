name: Validate registry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical router test dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Validate cases
        run: python3 scripts/validate_cases.py
      - name: Verify Toolkit historical locator and accepted successions
        run: python3 scripts/validate_history_locator.py
      - name: Verify generated historical reference indices
        run: python3 scripts/build_archive_reference.py --check
      - name: Validate source-controlled canonical execution records
        run: python3 scripts/verify_persisted_execution.py
      - name: Run negative tests
        run: python3 -m unittest discover -s tests -v

  DCO:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check all pull request commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
