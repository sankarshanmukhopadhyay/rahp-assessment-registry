name: Validate registry
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cases
        run: python3 scripts/validate_cases.py
      - name: Run negative tests
        run: python3 -m unittest discover -s tests -v
