name: Registry accepted monitored-group epoch delivery
on:
  pull_request:
    paths:
      - '.github/workflows/registry-group-epoch-observation.yml'
      - 'scripts/registry_group_epoch_observation.py'
      - 'tests/test_registry_group_epoch_observation.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-group-epoch-observation.yml'
      - 'scripts/registry_group_epoch_observation.py'
      - 'tests/test_registry_group_epoch_observation.py'
  schedule:
    - cron: '37 14 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Acknowledge exact new source epoch only if Toolkit accepted transfer and Registry owner are verified'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 1a98fe90211708bbb4f5c699218b17e99d7d9c0d
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: main
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Reject tampered and duplicate epoch observations
        run: python3 -m unittest discover -s tests -p 'test_registry_group_epoch_observation.py' -v
      - name: Check live accepted-group authority before source collection
        id: authority
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/epoch
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import registry_group_epoch_observation as epoch
          import registry_monitored_group_delivery as group
          import registry_intake as gh
          token = os.environ['REGISTRY_INTAKE_TOKEN']
          fetch = lambda url: gh.request('GET', url, token)
          sha = group.read_head(fetch, epoch.TK)
          ledger = group.read_pinned(fetch, epoch.TK, group.LEDGER, sha)
          intent = json.loads(Path(
              'outbox/pending/spec-dependency-2026-11-16.json').read_text())
          active = epoch.accepted_record(intent, ledger) is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('active=' + str(active).lower() + '\n')
          if not active:
              receipt = {
                  'schema': 'rahp-registry-new-group-epoch/v1',
                  'state': 'inactive_no_accepted_transfer',
                  'toolkit_main_sha': sha,
                  'observation_acknowledged': False,
                  'issue_written': False,
                  'assurance_determination': None,
                  'cutover_authorized': False,
              }
              Path('build/epoch/new-epoch-receipt.json').write_text(
                  json.dumps(receipt, indent=2) + '\n')
          print('Accepted group present:', active)
          PY
      - name: Verify current Monitor source through canonical Toolkit freshness
        if: steps.authority.outputs.active == 'true'
        id: source
        run: >-
          python3 toolkit/tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2 --output build/epoch/findings.json
      - name: Reproduce original canonical Toolkit materiality grouping
        if: steps.authority.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C toolkit rev-parse HEAD)" = 1a98fe90211708bbb4f5c699218b17e99d7d9c0d ]]
          day='${{ steps.source.outputs.date }}'
          file="monitor/data/findings/${day:0:4}/${day:5:2}/${day:8:2}.json"
          test -s "$file"
          python3 - "$file" <<'PY'
          import json, sys
          from pathlib import Path
          a = json.loads(Path(sys.argv[1]).read_text())
          b = json.loads(Path('build/epoch/findings.json').read_text())
          if a != b:
              raise SystemExit('current observed snapshot differs from pinned Monitor checkout')
          PY
          python3 toolkit/tools/dtg_portfolio_routing.py \
            --findings build/epoch/findings.json \
            --policy toolkit/instances/dtg/assurance-routing.yaml \
            --normalization-policy toolkit/instances/dtg/finding-normalization.yaml \
            --snapshot-date "$day" --out-dir build/epoch
      - name: Acknowledge only exact accepted Registry successor and changed epoch
        if: steps.authority.outputs.active == 'true'
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          APPLY_MODE: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=()
          if [ "$APPLY_MODE" = true ]; then arguments+=(--apply); fi
          python3 scripts/registry_group_epoch_observation.py \
            --manifest outbox/pending/spec-dependency-2026-11-16.json \
            --combined build/epoch/combined-events.json \
            --findings build/epoch/findings.json \
            --monitor-revision "$(git -C monitor rev-parse HEAD)" \
            --receipt build/epoch/new-epoch-receipt.json "${arguments[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: registry-monitored-epoch-receipt
          path: build/epoch/
          if-no-files-found: warn
