name: DTG operational routing code parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtg-routing-code-parity.yml'
      - 'ops/dtg/**'
      - 'scripts/compare_dtg_routing_outputs.py'
      - 'scripts/verify_release_tag_pins.py'
      - 'tests/test_release_tag_pins.py'
      - 'ops/migration/nov16-annotated-tags.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout canonical Toolkit revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 7925a7edf87a74f222f163f879f73a7f38de4686
          path: toolkit
          persist-credentials: false
      - name: Checkout historical Monitor snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: 7e2813c8daf867a21e4064513cc83612726aeb44
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Validate combined source-evidence contract
        run: python3 -m unittest discover -s tests -p 'test_registry_dtg_combined_source_provenance.py' -v
      - name: Test output parity falsifications
        run: python3 -m unittest discover -s tests -p 'test_dtg_routing_parity.py' -v
      - name: Execute both routers against exactly the same source
        shell: bash
        run: |
          set -euo pipefail
          # Preserve historical source dates; this is a pinned replay, not a
          # claim of current freshness or live publication.
          for day in 13 16; do
            snapshot="monitor/data/findings/2026/11/${day}.json"
            test -s "$snapshot"
            date="2026-11-${day}"
            mkdir -p "build/parity/${date}"
            python3 toolkit/tools/dtg_portfolio_routing.py \
              --findings "$snapshot" \
              --policy toolkit/instances/dtg/assurance-routing.yaml \
              --normalization-policy toolkit/instances/dtg/finding-normalization.yaml \
              --snapshot-date "$date" \
              --out-dir "build/parity/${date}/toolkit"
            python3 ops/dtg/dtg_portfolio_routing.py \
              --findings "$snapshot" \
              --policy ops/dtg/config/assurance-routing.yaml \
              --normalization-policy ops/dtg/config/finding-normalization.yaml \
              --snapshot-date "$date" \
              --out-dir "build/parity/${date}/registry"
            python3 scripts/compare_dtg_routing_outputs.py \
              --toolkit "build/parity/${date}/toolkit" \
              --registry "build/parity/${date}/registry" \
              --out "build/parity/${date}/receipt.json"
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = ("2026-11-13", "2026-11-16")
          evidence = []
          for day in expected:
              receipt = json.loads(Path(f"build/parity/{day}/receipt.json").read_text())
              if receipt.get("unexplained_differences"):
                  raise SystemExit("unexplained routing parity discrepancy: " + day)
              snapshot = Path(f"monitor/data/findings/2026/11/{day[-2:]}.json")
              evidence.append({"date": day, "source_sha256": hashlib.sha256(snapshot.read_bytes()).hexdigest(),
                               "receipt": f"build/parity/{day}/receipt.json"})
          Path("build/parity/snapshot-set.json").write_text(json.dumps({
              "schema": "rahp-registry-two-snapshot-routing-parity/v1",
              "monitor_revision": "7e2813c8daf867a21e4064513cc83612726aeb44",
              "toolkit_revision": "7925a7edf87a74f222f163f879f73a7f38de4686",
              "sources": evidence, "source_writes": 0, "case_writes": 0,
              "operational_cutover_qualified": False}, indent=2, sort_keys=True) + "\n")
          PY
      - name: Verify all November 16 combined groups against live annotated tags
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_release_tag_pins.py' -v
          python3 scripts/verify_release_tag_pins.py \
            --evidence ops/migration/nov16-annotated-tags.json \
            --findings monitor/data/findings/2026/11/16.json \
            --combined-events build/parity/2026-11-16/registry/combined-events.json \
            --out build/parity/2026-11-16/combined-source-qualification.json
      - name: Retain exact output and parity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dtg-routing-code-parity
          path: build/parity/
          if-no-files-found: warn
