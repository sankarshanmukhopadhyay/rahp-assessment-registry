name: Registry intake pilot (manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-intake-pilot.yml'
      - 'scripts/registry_intake.py'
      - 'intake/manifests/network-answer-pilot.json'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Explicitly allow registry issue writes (pilot should resolve existing #4)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical router test dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Validate intake contracts and negative cases
        run: |
          python3 scripts/validate_cases.py
          python3 -m unittest discover -s tests -v
      - name: Reconcile pinned transferred pilot against live registry
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --events intake/manifests/network-answer-pilot.json
            --out intake-receipt.json
          )
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python3 scripts/registry_intake.py "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('intake-receipt.json').read_text())
          assert len(receipt["decisions"]) == 1
          decision = receipt["decisions"][0]
          assert decision["action"] == "existing-owner", "pilot must not create a duplicate"
          assert decision["number"] == 4, "pilot owner must remain registry issue #4"
          print("Pilot reconciled with existing registry #4; no duplicate created")
          PY
      - name: Retain registry intake receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-intake-pilot-receipt
          path: intake-receipt.json
          if-no-files-found: warn
