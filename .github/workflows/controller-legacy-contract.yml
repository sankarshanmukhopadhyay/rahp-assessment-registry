name: Canonical Toolkit controller legacy contract preflight
on:
  pull_request:
    paths:
      - '.github/workflows/controller-legacy-contract.yml'
      - 'scripts/verify_controller_legacy_contract.py'
      - 'tests/test_controller_legacy_contract.py'
      - 'cases/dtg/network-answer-proof-2026-11.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/controller-legacy-contract.yml'
      - 'scripts/verify_controller_legacy_contract.py'
      - 'tests/test_controller_legacy_contract.py'
      - 'cases/dtg/network-answer-proof-2026-11.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout canonical Toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Fail-closed registry pilot unit tests
        run: python3 -m unittest discover -s tests -p 'test_controller_legacy_contract.py' -v
      - name: Execute actual pinned Toolkit identity contracts
        run: |
          python3 scripts/verify_controller_legacy_contract.py \
            --toolkit toolkit \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --out build/controller-legacy/receipt.json
      - name: Retain narrow compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-legacy-contract-preflight
          path: build/controller-legacy/
          if-no-files-found: warn
