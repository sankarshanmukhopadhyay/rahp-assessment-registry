name: Registry durable intake replay (controlled)
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Approved committed path under outbox/pending/'
        required: true
        default: 'outbox/pending/network-answer-pilot.json'
        type: string
      apply:
        description: 'Explicitly allow Registry-only issue creation'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate Registry contract and negative cases
        run: |
          python3 scripts/validate_cases.py
          python3 -m unittest discover -s tests -v
      - name: Reconcile committed source intent against live Registry
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          REQUEST_MANIFEST: ${{ inputs.manifest }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_MANIFEST" =~ ^outbox/pending/[a-z0-9][a-z0-9-]*\.json$ ]]; then
            echo 'INVALID unapproved manifest path' >&2
            exit 1
          fi
          test -f "$REQUEST_MANIFEST" && test ! -L "$REQUEST_MANIFEST"
          options=(--manifest "$REQUEST_MANIFEST" --receipt build/outbox/receipt.json)
          if [[ "$APPLY" = "true" ]]; then
            options+=(--apply)
          fi
          python3 scripts/registry_outbox.py "${options[@]}"
      - name: Retain delivery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-outbox-delivery
          path: build/outbox/receipt.json
          if-no-files-found: warn
