name: Registry durable intake replay (controlled)
on:
  pull_request:
    paths:
      - '.github/workflows/registry-outbox-replay.yml'
      - 'scripts/registry_outbox.py'
      - 'scripts/registry_intake.py'
      - 'scripts/registry_materiality_intake.py'
      - 'tests/test_registry_outbox.py'
      - 'scripts/registry_direct_intake.py'
      - 'scripts/registry_monitored_intake.py'
      - 'tests/test_registry_monitored_intake.py'
      - 'ops/migration/monitored-intake-authorizations.json'
      - 'tests/test_registry_direct_intake.py'
      - 'ops/migration/direct-intake-authorizations.json'
      - 'outbox/pending/**'
      - 'tests/test_registry_materiality_intake.py'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Approved committed path under outbox/pending/'
        required: true
        default: 'outbox/pending/network-answer-pilot.json'
        type: string
      apply:
        description: 'Verify existing Registry owner in controlled write-mode; new creation still requires cutover'
        required: true
        type: boolean
        default: false
      direct_intake:
        description: 'Enable only reviewed direct-source first intake (not historical Toolkit transfer)'
        required: true
        type: boolean
        default: false
      monitored_intake:
        description: 'Exact approved monitored source intake (requires independent writer exclusion)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  issues: read
concurrency:
  group: registry-case-publication
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical router test dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Validate Registry contracts and adversarial tests
        run: |
          python3 scripts/validate_cases.py
          python3 -m unittest discover -s tests -v
      - name: Qualify committed intent against live Registry with read-only token
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          REQUEST_MANIFEST: ${{ inputs.manifest || 'outbox/pending/network-answer-pilot.json' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_MANIFEST" =~ ^outbox/pending/[a-z0-9][a-z0-9-]*\.json$ ]]; then
            echo 'INVALID unapproved manifest path' >&2
            exit 1
          fi
          test -f "$REQUEST_MANIFEST" && test ! -L "$REQUEST_MANIFEST"
          if [[ "${{ inputs.direct_intake }}" = "true" && "${{ inputs.monitored_intake }}" = "true" ]]; then
            echo 'INVALID: direct and monitored intake are mutually exclusive' >&2
            exit 1
          fi
          if [[ "${{ inputs.monitored_intake }}" = "true" ]]; then
            python3 scripts/registry_monitored_intake.py \
              --manifest "$REQUEST_MANIFEST" \
              --receipt build/outbox/preflight.json
          elif [[ "${{ inputs.direct_intake }}" = "true" ]]; then
            python3 scripts/registry_direct_intake.py \
              --manifest "$REQUEST_MANIFEST" \
              --receipt build/outbox/preflight.json
          else
            python3 scripts/registry_outbox.py \
              --manifest "$REQUEST_MANIFEST" \
              --receipt build/outbox/preflight.json
          fi
      - name: Verify both live direct-case owner identities without writes
        if: github.event_name == 'pull_request'
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/registry_outbox.py \
            --manifest outbox/pending/ondtf-emergency-authority-v1.json \
            --receipt build/outbox/ondtf-direct-owner.json
          python3 scripts/registry_outbox.py \
            --manifest outbox/pending/vti-session-refusal-stepup-2026-11-18.json \
            --receipt build/outbox/vti-direct-owner.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, number, case_id in (
              ('ondtf', 47, 'RAHP-AR-ONDTF-0001'),
              ('vti', 79, 'RAHP-AR-VTI-0001')):
              receipt = json.loads(Path(f'build/outbox/{name}-direct-owner.json').read_text())
              assert receipt['state'] == 'owner_observed'
              assert receipt['owner_number'] == number
              assert receipt['mode'] == 'dry_run'
              assert receipt['assurance_determination'] is None
              print(f'PASS source-qualified {case_id} owner #{number}; no writes')
          PY
      - name: Retain qualified source intent and live owner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-outbox-preflight
          path: build/outbox/preflight.json
          if-no-files-found: warn
  publish:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: registry-outbox-preflight
          path: build/outbox
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Refuse new-case dual publication before coordinated Toolkit cutover
        env:
          DIRECT_INTAKE: ${{ inputs.direct_intake }}
          MONITORED_INTAKE: ${{ inputs.monitored_intake }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('build/outbox/preflight.json').read_text())
          assert receipt.get('schema') in (
              'rahp-registry-intake-receipt/v1',
              'rahp-registry-direct-intake-qualification/v1')
          assert receipt.get('mode') == 'dry_run'
          assert receipt.get('assurance_determination') is None
          assert receipt.get('controller_execution') is None
          import os
          if os.environ.get('MONITORED_INTAKE') == 'true':
              assert os.environ.get('DIRECT_INTAKE') != 'true'
              assert receipt.get('schema') == 'rahp-registry-monitored-intake-qualification/v1'
              assert receipt.get('state') == 'qualified'
              assert receipt.get('toolkit_current_policy_is_registry') is True
              assert receipt.get('toolkit_writers_quiescent_at_observation') is True
              print('Monitored source qualified; historical writer exclusion still required.')
          elif os.environ.get('DIRECT_INTAKE') == 'true':
              assert receipt.get('schema') == 'rahp-registry-direct-intake-qualification/v1'
              assert receipt.get('state') == 'qualified'
              assert receipt.get('source_only_direct_intake') is True
              assert receipt.get('source_commit_observed') is True
              assert receipt.get('no_toolkit_issue_created') is True
              print('Exact admitted direct-first-intake owner creation authorized for this dispatch.')
          else:
              if receipt.get('state') != 'owner_observed':
                  raise SystemExit(
                      'BLOCKED: new Registry issue creation requires a coordinated, '
                      'evidence-qualified Toolkit publisher cutover. The reviewed '
                      'materiality/source pin alone does not confer publication authority.'
                  )
              print('Existing owner-only replay authorized; no new issue creation.')
          PY
      - name: Reconcile only the existing owner with authoritative re-read
        if: inputs.direct_intake != true && inputs.monitored_intake != true
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          REQUEST_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python3 scripts/registry_outbox.py \
            --manifest "$REQUEST_MANIFEST" \
            --receipt build/outbox/replayed.json --apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          pre = json.loads(Path('build/outbox/preflight.json').read_text())
          post = json.loads(Path('build/outbox/replayed.json').read_text())
          assert post['state'] == 'owner_observed'
          assert post['owner_number'] == pre['owner_number']
          assert post['owner_url'] == pre['owner_url']
          assert post['assurance_determination'] is None
          assert post['controller_execution'] is None
          print('Existing Registry case verified again; no new issue, no RAHP PASS.')
          PY
      - name: Publish strictly approved direct case with authoritative re-read
        if: inputs.direct_intake == true && inputs.monitored_intake != true
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          REQUEST_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          python3 scripts/registry_direct_intake.py \
            --manifest "$REQUEST_MANIFEST" \
            --receipt build/outbox/replayed.json --apply
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('build/outbox/preflight.json').read_text())
          after = json.loads(Path('build/outbox/replayed.json').read_text())
          assert before['state'] == 'qualified'
          assert after['state'] == 'owner_observed'
          assert after['owner_url'] and after['owner_number']
          for key in ('assessment_key', 'source_revision', 'registry_main_sha',
                      'toolkit_main_sha'):
              assert before[key] == after[key]
          assert after['assurance_determination'] is None
          assert after['controller_execution'] is None
          assert after['first_case_execution'] is False
          print('Source-qualified case owner observed; controller/assurance not executed.')
          PY
      - name: Require independent historical-writer exclusion before monitored issue creation
        if: inputs.monitored_intake == true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/outbox/preflight.json').read_text())
          if (data.get('schema') != 'rahp-registry-monitored-intake-qualification/v1'
                  or data.get('historical_execution_exclusion_proven') is not True
                  or data.get('cross_repository_atomic_lock_proven') is not True):
              raise SystemExit('BLOCKED: no independently evidenced historical writer exclusion / cross-repository ownership lock')
          PY
      - name: Publish qualified monitored case
        if: inputs.monitored_intake == true
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
          REQUEST_MANIFEST: ${{ inputs.manifest }}
        run: |
          python3 scripts/registry_monitored_intake.py \
            --manifest "$REQUEST_MANIFEST" \
            --receipt build/outbox/replayed.json --apply
      - name: Retain replay acknowledgment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-outbox-existing-owner-acknowledgment
          path: build/outbox/replayed.json
          if-no-files-found: warn
