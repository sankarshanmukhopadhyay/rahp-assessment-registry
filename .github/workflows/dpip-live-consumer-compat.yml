name: Canonical DPIP historical return consumer replay
on:
  pull_request:
    paths:
      - '.github/workflows/dpip-live-consumer-compat.yml'
      - 'scripts/verify_dpip_legacy_consumer.py'
      - 'tests/test_dpip_legacy_consumer.py'
      - 'tests/test_dpip_portable_return.py'
      - 'scripts/registry_specialist_return.py'
      - 'tests/test_registry_specialist_return.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpip-live-consumer-compat.yml'
      - 'scripts/verify_dpip_legacy_consumer.py'
      - 'tests/test_dpip_legacy_consumer.py'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  live-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout canonical RAHP Toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Negative consumer-path tests
        run: python3 -m unittest discover -s tests -p 'test_dpip_legacy_consumer.py' -v
      - name: Validate portable return tampering and counterfeit examples
        run: python3 -m unittest discover -s tests -p 'test_dpip_portable_return.py' -v
      - name: Exercise Registry-targeted admission with pinned canonical Toolkit schema
        run: |
          python3 -m unittest discover -s tests -p 'test_registry_specialist_return.py' -v
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path[:0] = [str(Path('tests').resolve()), str(Path('scripts').resolve()),
                          str(Path('toolkit/tools').resolve())]
          from test_registry_specialist_return import fixtures, RealContractStub
          from registry_specialist_return import qualify, SpecialistAdmissionError
          import assessor_contract
          data = fixtures()
          receipt = qualify(*data, assessor_contract)
          assert receipt['canonical_assessor_schema_validated']
          assert not receipt['return_transport_authenticated']
          assert not receipt['case_determination_imported']
          case = json.loads(Path('cases/dtg/network-answer-proof-2026-11.json').read_text())
          try:
              qualify(case, *data[1:], assessor_contract)
          except SpecialistAdmissionError as exc:
              assert 'no unique admitted' in str(exc), str(exc)
          else:
              raise SystemExit('FAIL: pilot without DPIP referral incorrectly accepted')
          print('PASS canonical DPIP schema on admitted synthetic route; actual pilot unadmitted')
          PY
      - name: Read live Toolkit and DPIP historical issues and exercise actual consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_dpip_legacy_consumer.py \
            --toolkit toolkit \
            --out build/dpip-legacy-consumer/receipt.json
      - name: Retain bounded historical return receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-dpip-consumer-parity
          path: build/dpip-legacy-consumer/receipt.json
          if-no-files-found: warn
