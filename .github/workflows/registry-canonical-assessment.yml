name: Registry source-pinned canonical RAHP assessment
on:
  pull_request:
    paths:
      - '.github/workflows/registry-canonical-assessment.yml'
      - 'ops/assessments/**'
      - 'scripts/verify_registry_assessment_run.py'
      - 'tests/test_registry_assessment_run.py'
      - 'scripts/bind_registry_execution.py'
      - 'tests/test_registry_execution_binding.py'
      - 'cases/dtg/network-answer-proof-2026-11.json'
      - 'ops/executions/**'
      - 'scripts/verify_persisted_execution.py'
      - 'tests/test_persisted_execution.py'
      - 'cases/ondtf/**'
      - 'ops/assessments/ondtf-**'
      - 'scripts/bind_direct_execution.py'
      - 'tests/test_direct_execution_binding.py'
      - 'cases/dtg/vti-session-refusal-2026-11.json'
      - 'ops/assessments/vti-session-refusal.*.json'
      - 'tests/test_vti_direct_execution.py'
      - 'cases/dtg/spec-dependency-2026-11.json'
      - 'ops/assessments/dtg-spec-dependency-transferred.*.json'
      - 'scripts/bind_transferred_execution.py'
      - 'tests/test_transferred_execution_binding.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-canonical-assessment.yml'
      - 'ops/assessments/**'
      - 'scripts/verify_registry_assessment_run.py'
      - 'tests/test_registry_assessment_run.py'
      - 'scripts/bind_registry_execution.py'
      - 'tests/test_registry_execution_binding.py'
      - 'cases/dtg/network-answer-proof-2026-11.json'
      - 'ops/executions/**'
      - 'scripts/verify_persisted_execution.py'
      - 'tests/test_persisted_execution.py'
      - 'cases/ondtf/**'
      - 'ops/assessments/ondtf-**'
      - 'scripts/bind_direct_execution.py'
      - 'tests/test_direct_execution_binding.py'
      - 'cases/dtg/vti-session-refusal-2026-11.json'
      - 'ops/assessments/vti-session-refusal.*.json'
      - 'tests/test_vti_direct_execution.py'
      - 'cases/dtg/spec-dependency-2026-11.json'
      - 'ops/assessments/dtg-spec-dependency-transferred.*.json'
      - 'scripts/bind_transferred_execution.py'
      - 'tests/test_transferred_execution_binding.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs only; never cancel evidence-bearing main/dispatch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  canonical-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout immutable canonical Toolkit engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r toolkit/requirements.txt
      - name: Reject fabricated and mismatched run evidence
        run: |
          python3 -m unittest discover -s tests -p 'test_registry_assessment_run.py' -v
          python3 -m unittest discover -s tests -p 'test_registry_execution_binding.py' -v
          python3 -m unittest discover -s tests -p 'test_direct_execution_binding.py' -v
          python3 -m unittest discover -s tests -p 'test_vti_direct_execution.py' -v
      - name: Execute actual canonical RAHP controller
        shell: bash
        run: |
          set -euo pipefail
          expected=70298566dc897669e22bf37759843d6b7c0597d2
          [[ "$(git -C toolkit rev-parse HEAD)" = "$expected" ]]
          mkdir -p build/registry-assessment
          python3 toolkit/tools/autonomous_assurance_controller.py \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --machine-output build/registry-assessment/result.json \
            --human-output build/registry-assessment/result.md
          python3 scripts/verify_registry_assessment_run.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --out build/registry-assessment/receipt.json
          python3 scripts/bind_registry_execution.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/execution-binding.json
          python3 scripts/bind_registry_execution.py \
            --case cases/dtg/network-answer-proof-2026-11.json \
            --spec ops/assessments/network-answer-pilot.spec.json \
            --ledger ops/assessments/network-answer-pilot.ledger.json \
            --result build/registry-assessment/result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/execution-binding.json --verify
          python3 scripts/verify_persisted_execution.py \
            --actual-result build/registry-assessment/result.json
      - name: Execute ONDTF direct Registry case through actual canonical Toolkit controller
        shell: bash
        run: |
          set -euo pipefail
          expected=70298566dc897669e22bf37759843d6b7c0597d2
          [[ "$(git -C toolkit rev-parse HEAD)" = "$expected" ]]
          python3 toolkit/tools/autonomous_assurance_controller.py \
            --spec ops/assessments/ondtf-emergency-authority.spec.json \
            --ledger ops/assessments/ondtf-emergency-authority.ledger.json \
            --machine-output build/registry-assessment/ondtf-result.json \
            --human-output build/registry-assessment/ondtf-result.md
          python3 scripts/bind_direct_execution.py \
            --case cases/ondtf/emergency-authority-v1.json \
            --spec ops/assessments/ondtf-emergency-authority.spec.json \
            --ledger ops/assessments/ondtf-emergency-authority.ledger.json \
            --result build/registry-assessment/ondtf-result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/ondtf-binding.json
          python3 scripts/bind_direct_execution.py \
            --case cases/ondtf/emergency-authority-v1.json \
            --spec ops/assessments/ondtf-emergency-authority.spec.json \
            --ledger ops/assessments/ondtf-emergency-authority.ledger.json \
            --result build/registry-assessment/ondtf-result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/ondtf-binding.json --verify
      - name: Execute VTI direct Registry materiality through canonical Toolkit controller
        shell: bash
        run: |
          set -euo pipefail
          expected=70298566dc897669e22bf37759843d6b7c0597d2
          [[ "$(git -C toolkit rev-parse HEAD)" = "$expected" ]]
          python3 toolkit/tools/autonomous_assurance_controller.py \
            --spec ops/assessments/vti-session-refusal.spec.json \
            --ledger ops/assessments/vti-session-refusal.ledger.json \
            --machine-output build/registry-assessment/vti-result.json \
            --human-output build/registry-assessment/vti-result.md
          python3 scripts/bind_direct_execution.py \
            --case cases/dtg/vti-session-refusal-2026-11.json \
            --spec ops/assessments/vti-session-refusal.spec.json \
            --ledger ops/assessments/vti-session-refusal.ledger.json \
            --result build/registry-assessment/vti-result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/vti-binding.json
          python3 scripts/bind_direct_execution.py \
            --case cases/dtg/vti-session-refusal-2026-11.json \
            --spec ops/assessments/vti-session-refusal.spec.json \
            --ledger ops/assessments/vti-session-refusal.ledger.json \
            --result build/registry-assessment/vti-result.json \
            --toolkit-revision "$expected" \
            --out build/registry-assessment/vti-binding.json --verify
      - name: Checkout current Toolkit transfer authority without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: main
          path: toolkit-authority
          persist-credentials: false
      - name: Qualify accepted Registry 88 group through canonical Toolkit execution
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_transferred_execution_binding.py' -v
          expected=70298566dc897669e22bf37759843d6b7c0597d2
          [[ "$(git -C toolkit rev-parse HEAD)" = "$expected" ]]
          authority_revision="$(git -C toolkit-authority rev-parse HEAD)"
          python3 toolkit/tools/autonomous_assurance_controller.py \
            --spec ops/assessments/dtg-spec-dependency-transferred.spec.json \
            --ledger ops/assessments/dtg-spec-dependency-transferred.ledger.json \
            --machine-output build/registry-assessment/accepted-group-result.json \
            --human-output build/registry-assessment/accepted-group-result.md
          python3 scripts/bind_transferred_execution.py \
            --case cases/dtg/spec-dependency-2026-11.json \
            --transfer-ledger toolkit-authority/instances/dtg/registry-transfers.json \
            --spec ops/assessments/dtg-spec-dependency-transferred.spec.json \
            --evidence-ledger ops/assessments/dtg-spec-dependency-transferred.ledger.json \
            --result build/registry-assessment/accepted-group-result.json \
            --engine-revision "$expected" \
            --transfer-ledger-revision "$authority_revision" \
            --out build/registry-assessment/accepted-group-binding.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("build/registry-assessment/accepted-group-binding.json").read_text())
          assert receipt["result_outcome"] == "INDETERMINATE"
          assert all(receipt[k] is False for k in (
              "case_determination_imported",
              "source_transfer_authority_extended",
              "registry_to_toolkit_dispatch_authorized",
              "specialist_return_authenticated",
              "controller_cutover_qualified"))
          print("Registry #88 canonical execution binding: source-qualified; no assurance import")
          PY
      - name: Retain source-pinned indeterminate run and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-registry-assessment
          path: build/registry-assessment/
          if-no-files-found: warn
