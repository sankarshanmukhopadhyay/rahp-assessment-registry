name: Registry DTG monitoring shadow (no issue writes)
on:
  pull_request:
    paths:
      - '.github/workflows/dtg-live-shadow.yml'
      - 'scripts/verify_live_shadow.py'
      - 'scripts/compare_dtg_routing_outputs.py'
      - 'tests/test_dtg_routing_parity.py'
      - 'ops/dtg/**'
      - 'scripts/registry_materiality_intake.py'
      - 'scripts/audit_toolkit_transfer_lineage.py'
      - 'tests/test_toolkit_transfer_lineage.py'
      - 'ops/migration/candidates/**'
      - 'scripts/registry_intake.py'
      - 'scripts/registry_outbox.py'
      - 'tests/test_registry_materiality_intake.py'
      - 'outbox/pending/**'
  schedule:
    - cron: '7 1,13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtg-live-shadow.yml'
      - 'scripts/verify_live_shadow.py'
      - 'scripts/compare_dtg_routing_outputs.py'
      - 'tests/test_dtg_routing_parity.py'
      - 'ops/dtg/**'
      - 'scripts/registry_materiality_intake.py'
      - 'scripts/audit_toolkit_transfer_lineage.py'
      - 'tests/test_toolkit_transfer_lineage.py'
      - 'ops/migration/candidates/**'
      - 'scripts/registry_intake.py'
      - 'scripts/registry_outbox.py'
      - 'tests/test_registry_materiality_intake.py'
      - 'outbox/pending/**'
permissions:
  contents: read
  issues: read
concurrency:
  group: registry-dtg-live-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
      - name: Checkout canonical Toolkit routing implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - name: Checkout current Monitor source to pin consumed state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: main
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical Toolkit routing dependencies
        run: python3 -m pip install -r toolkit/requirements.txt
      - name: Validate shadow false-success boundaries
        run: python3 -m unittest discover -s registry/tests -p 'test_verify_live_shadow.py' -v
      - name: Fail closed on material routing mismatches
        run: python3 -m unittest discover -s registry/tests -p 'test_dtg_routing_parity.py' -v
      - name: Falsify reviewed materiality case/intake and reassessment boundaries
        run: python3 -m unittest discover -s registry/tests -p 'test_registry_materiality_intake.py' -v
      - name: Fetch newest valid source through Toolkit's canonical freshness contract
        id: snapshot
        run: >-
          python3 toolkit/tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2 --output build/live/findings.json
      - name: Execute authoritative semantic router without publication
        shell: bash
        run: |
          set -euo pipefail
          python3 toolkit/tools/dtg_portfolio_routing.py \
            --findings build/live/findings.json \
            --policy toolkit/instances/dtg/assurance-routing.yaml \
            --normalization-policy toolkit/instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/live/toolkit
          python3 registry/ops/dtg/dtg_portfolio_routing.py \
            --findings build/live/findings.json \
            --policy registry/ops/dtg/config/assurance-routing.yaml \
            --normalization-policy registry/ops/dtg/config/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/live/registry
          python3 registry/scripts/compare_dtg_routing_outputs.py \
            --toolkit build/live/toolkit \
            --registry build/live/registry \
            --out build/live/dual-router-parity.json
          day='${{ steps.snapshot.outputs.date }}'
          file="monitor/data/findings/${day:0:4}/${day:5:2}/${day:8:2}.json"
          test -s "$file" || { echo 'Pinned Monitor snapshot missing'; exit 1; }
          monitor_revision="$(git -C monitor rev-parse HEAD)"
          python3 registry/scripts/verify_live_shadow.py \
            --source "$file" \
            --fetched build/live/findings.json \
            --routing build/live/toolkit/routing.json \
            --combined build/live/toolkit/combined-events.json \
            --dpip build/live/toolkit/dpip-events.json \
            --unresolved build/live/toolkit/unresolved.json \
            --source-date "$day" \
            --toolkit-revision 70298566dc897669e22bf37759843d6b7c0597d2 \
            --monitor-revision "$monitor_revision" \
            --out build/live/provenance.json
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('build/live')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          receipt = json.loads((root / 'dual-router-parity.json').read_text())
          shadow = json.loads((root / 'provenance.json').read_text())
          assert not receipt['unexplained_differences']
          assert shadow['effects']['fresh_monitor_coverage'] is True
          assert shadow['effects']['issues_created'] == 0
          receipt['source'] = {
              'snapshot_sha256': sha(root / 'findings.json'),
              'toolkit_revision': subprocess.check_output(['git', '-C', 'toolkit', 'rev-parse', 'HEAD'], text=True).strip(),
              'registry_revision': subprocess.check_output(['git', '-C', 'registry', 'rev-parse', 'HEAD'], text=True).strip(),
              'monitor_revision': subprocess.check_output(['git', '-C', 'monitor', 'rev-parse', 'HEAD'], text=True).strip(),
              'toolkit_policy_sha256': sha('toolkit/instances/dtg/assurance-routing.yaml'),
              'toolkit_normalization_sha256': sha('toolkit/instances/dtg/finding-normalization.yaml'),
              'registry_policy_sha256': sha('registry/ops/dtg/config/assurance-routing.yaml'),
              'registry_normalization_sha256': sha('registry/ops/dtg/config/finding-normalization.yaml'),
              'source_verified_by': 'provenance.json',
          }
          receipt['source']['source_date'] = shadow['source']['snapshot_date']
          receipt['effects'] = {'new_issues': 0, 'external_referrals': 0, 'source_writes': 0}
          (root / 'dual-router-parity.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print('PASS live dual-router output equality with independently qualified source freshness; no publication')
          PY
      - name: Reconcile live materiality with reviewed Registry case intent (read-only)
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 registry/scripts/registry_materiality_intake.py \
            --findings build/live/findings.json \
            --routing build/live/registry/routing.json \
            --approved-dir registry/outbox/pending \
            --receipt build/live/registry-materiality-intake.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('build/live')
          receipt = json.loads((base / 'registry-materiality-intake.json').read_text())
          actual = json.loads((base / 'registry/routing.json').read_text())
          assert receipt['schema'] == 'rahp-registry-materiality-batch-shadow/v1'
          assert receipt['state'] == 'read_only_reconciliation'
          assert receipt['observed_routed_count'] == len(actual)
          assert receipt['reviewed_intent_count'] == len(receipt['intents'])
          observed = sum(int(x['decision']['approved_source_observed']) for x in receipt['intents'])
          owners = sum(x['decision']['state'] == 'existing_owner' and x['decision']['approved_source_observed'] for x in receipt['intents'])
          assert receipt['unreviewed_routed_count'] + observed == len(actual)
          assert receipt['without_confirmed_registry_owner_count'] + owners == len(actual)
          assert receipt['cutover_authorized'] is False
          assert all(x['decision']['new_issue_created'] is False for x in receipt['intents'])
          assert receipt['new_issue_created'] is False
          assert receipt['existing_issue_mutated'] is False
          assert receipt['source_reassessment_applied'] is False
          assert receipt['toolkit_issue_written'] is False
          assert receipt['assurance_determination_imported'] is False
          print('PASS reviewed case materiality reconciliation; no external writes')
          PY
      - name: Audit exact Toolkit transfer-candidate lineage (read-only)
        env:
          REGISTRY_INTAKE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s registry/tests -p 'test_toolkit_transfer_lineage.py' -v
          python3 registry/scripts/audit_toolkit_transfer_lineage.py \
            --candidate registry/ops/migration/candidates/toolkit-1194.json \
            --findings build/live/findings.json \
            --routing build/live/toolkit/routing.json \
            --combined build/live/toolkit/combined-events.json \
            --dpip build/live/toolkit/dpip-events.json \
            --out build/live/toolkit-1194-transfer-lineage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/live/toolkit-1194-transfer-lineage.json').read_text())
          assert r['cutover_authorized'] is False
          assert r['authority_transfer_accepted'] is False
          assert r['publisher_suppression_active'] is False
          assert r['issue_writes'] == 0
          PY
      - name: Retain Registry shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-dtg-live-shadow
          path: build/live/
          retention-days: 30
          if-no-files-found: warn
