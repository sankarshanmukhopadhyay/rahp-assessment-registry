name: Registry DTG monitoring shadow (no issue writes)
on:
  schedule:
    - cron: '7 1,13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtg-live-shadow.yml'
      - 'scripts/verify_live_shadow.py'
permissions:
  contents: read
concurrency:
  group: registry-dtg-live-shadow
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: registry
      - name: Checkout canonical Toolkit routing implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/rahp-toolkit
          ref: 70298566dc897669e22bf37759843d6b7c0597d2
          path: toolkit
          persist-credentials: false
      - name: Checkout current Monitor source to pin consumed state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sankarshanmukhopadhyay/dtg-portfolio-monitor
          ref: main
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install canonical Toolkit routing dependencies
        run: python3 -m pip install -r toolkit/requirements.txt
      - name: Validate shadow false-success boundaries
        run: python3 -m unittest discover -s registry/tests -p 'test_verify_live_shadow.py' -v
      - name: Fetch newest valid source through Toolkit's canonical freshness contract
        id: snapshot
        run: >-
          python3 toolkit/tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2 --output build/live/findings.json
      - name: Execute authoritative semantic router without publication
        shell: bash
        run: |
          set -euo pipefail
          python3 toolkit/tools/dtg_portfolio_routing.py \
            --findings build/live/findings.json \
            --policy toolkit/instances/dtg/assurance-routing.yaml \
            --normalization-policy toolkit/instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/live
          day='${{ steps.snapshot.outputs.date }}'
          file="monitor/data/findings/${day:0:4}/${day:5:2}/${day:8:2}.json"
          test -s "$file" || { echo 'Pinned Monitor snapshot missing'; exit 1; }
          monitor_revision="$(git -C monitor rev-parse HEAD)"
          python3 registry/scripts/verify_live_shadow.py \
            --source "$file" \
            --fetched build/live/findings.json \
            --routing build/live/routing.json \
            --combined build/live/combined-events.json \
            --dpip build/live/dpip-events.json \
            --unresolved build/live/unresolved.json \
            --source-date "$day" \
            --toolkit-revision 70298566dc897669e22bf37759843d6b7c0597d2 \
            --monitor-revision "$monitor_revision" \
            --out build/live/provenance.json
      - name: Retain Registry shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-dtg-live-shadow
          path: build/live/
          retention-days: 30
          if-no-files-found: warn
